<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>寰宇｜訂單管理</title><link rel="stylesheet" href="{{ url_for('static',filename='css/site.css') }}"></head><body><header><div class="nav"><b class="logo">寰宇管理後台</b><a class="cta" href="/">回前台</a></div></header><main class="section"><div class="title"><small>ADMIN</small><h2>預約訂單</h2></div><div class="table"><table><thead><tr><th>訂單</th><th>日期</th><th>客戶</th><th>路線</th><th>車型</th><th>金額</th><th>狀態</th></tr></thead><tbody>{% for b in bookings %}<tr><td>{{b.order_no}}</td><td>{{b.date}} {{b.time}}</td><td>{{b.name}}<br>{{b.phone}}</td><td>{{b.area}} → {{b.airport}}</td><td>{{b.vehicle}}</td><td>NT$ {{'{:,}'.format(b.price)}}</td><td><form method="post" action="/admin/{{b.id}}/status"><select name="status" onchange="this.form.submit()">{% for s in ['待確認','已確認','已派車','已完成','已取消'] %}<option {% if b.status==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select></form></td></tr>{% else %}<tr><td colspan="7">目前沒有訂單。</td></tr>{% endfor %}</tbody></table></div></main></body></html>
