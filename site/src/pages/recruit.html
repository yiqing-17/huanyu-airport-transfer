<!doctype html>
<html lang="zh-Hant-TW">
<head>
{{> head}}
</head>
<body>
{{> header}}
{{> page_head}}

<main id="main">
  <section class="section">
    <div class="wrap">
      <p class="offer-badge">第一年靠行費優待不收</p>
      <div class="recruit-light">
        <div>
          <h3>我們提供</h3>
            <ul class="checks checks-light">
              <li>高薪獎勵：收入穩定，另有額外獎金</li>
              <li>彈性排班：自由安排，兼職、全職皆可</li>
              <li>優質乘客：以商務、觀光客為主</li>
              <li>公司派單：不用自己找客人</li>
            </ul>
        </div>
        <div>
          <h3>應徵條件</h3>
            <ul class="checks checks-light">
              <li>持有合法駕照、職業駕駛登記證</li>
              <li>熟悉台灣道路、機場接送路線</li>
              <li>親切、守時、重視服務品質</li>
              <li>有租賃車牌者優先</li>
            </ul>
        </div>
      </div>
      <div class="ask">
        <p>有興趣？用 LINE 或電話與我們聯絡。</p>
        <div class="ask-actions">
          <a class="btn btn-navy" data-link="line" target="_blank" rel="noopener">用 LINE 詢問</a>
          <a class="btn btn-outline" data-link="phone">撥打電話</a>
        </div>
      </div>
    </div>
  </section>
</main>

{{> footer}}

<script src="js/config.js"></script>
<script src="js/site.js"></script>
</body>
</html>
